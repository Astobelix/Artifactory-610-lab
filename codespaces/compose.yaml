services:
  artifactory:
    image: ${ARTIFACTORY_IMAGE:?image requise}
    restart: unless-stopped
    environment:
      EXTRA_JAVA_OPTIONS: "-Xms512m -Xmx2g"
      JF_JFCONNECT_ENABLED: "false"
    volumes:
      - artifactory_data:/var/opt/jfrog/artifactory
    networks: [backend]
  nginx:
    image: docker.io/library/nginx:stable-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./nginx-${NGINX_GENERATION:?generation requise}.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [artifactory]
    networks: [backend]
volumes:
  artifactory_data:
networks:
  backend:
