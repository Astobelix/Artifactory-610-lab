name: Artifactory 6 et 7 - Captures graphiques Chromium
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/artifactory-visual-validation.yml'
      - 'scripts/ci_visual_check.mjs'
      - 'scripts/patch_jfconnect_visual.py'
      - 'scripts/patch_jfconnect_visual.py'
      - 'scripts/disable_jfconnect_visual.sh'
permissions:
  contents: read
jobs:
  visuel:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Preparer Playwright Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Installer Artifactory 6.1.0
        run: sudo bash scripts/install_lab_ubuntu.sh
      - name: Verifier la version initiale
        run: bash scripts/test_lab_ubuntu.sh
      - name: Capturer 6.1.0
        run: node scripts/ci_visual_check.mjs 6.1.0
      - name: Creer des donnees temoins
        run: bash scripts/verify_artifactory_data.sh
      - name: Migrer 6.1.0 vers 6.23.42
        run: bash scripts/ci_upgrade_62342.sh
      - name: Valider la version 6.23.42
        run: bash scripts/verify_upgrade_62342.sh
      - name: Capturer 6.23.42
        run: node scripts/ci_visual_check.mjs 6.23.42
      - name: Migrer vers 7.161.26
        run: bash scripts/ci_upgrade_716126.sh
      - name: Valider 7.161.26
        run: bash scripts/verify_upgrade_716126.sh
      - name: Corriger JFConnect OSS pour interface graphique
        run: bash scripts/disable_jfconnect_visual.sh
      - name: Tester correction JFConnect OSS dans le volume clone 7
        shell: bash
        run: |
          uid=$(id -u artifact)
          as_artifact() {
            (cd /home/artifact && sudo runuser -u artifact -- env -i HOME=/home/artifact USER=artifact LOGNAME=artifact PATH=/usr/local/bin:/usr/bin:/bin XDG_CONFIG_HOME=/home/artifact/.config XDG_DATA_HOME=/home/artifact/.local/share XDG_RUNTIME_DIR="/run/user/$uid" DBUS_SESSION_BUS_ADDRESS="unix:path=/run/user/$uid/bus" "$@")
          }
          as_artifact systemctl --user stop artifactory-lab.service
          vol=$(as_artifact podman volume inspect artifactory716126_data --format '{{.Mountpoint}}')
          config=$(sudo find "$vol" -type f -path '*/etc/system.yaml' -print -quit)
          test -n "$config"
          sudo python3 scripts/patch_jfconnect_visual.py "$config"
          as_artifact systemctl --user start artifactory-lab.service
          for i in $(seq 1 90); do
            if curl -fsS --max-time 8 http://127.0.0.1:8080/artifactory/api/system/ping >/dev/null 2>&1; then break; fi
            sleep 10
          done
          curl -fsS -u admin:password http://127.0.0.1:8080/artifactory/api/system/version | tee compose-lab-logs/version-7-jfconnect.json
      - name: Capturer 7.161.26
        run: node scripts/ci_visual_check.mjs 7.161.26
      - name: Tester ecriture et redemarrage 7.161.26
        run: bash scripts/verify_716126_restart.sh
      - name: Capturer apres redemarrage
        run: node scripts/ci_visual_check.mjs 7.161.26-restart
      - name: Collecter diagnostics
        if: always()
        run: bash scripts/collect_upgrade_716126_diagnostics.sh
      - name: Publier les captures PNG et les rapports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: artifactory-captures-android-edge
          path: |
            captures-artifactory/
            compose-lab-logs/
          if-no-files-found: warn
          retention-days: 3
